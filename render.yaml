services:
  - type: web
    name: cmx-api
    runtime: python
    plan: starter
    buildCommand: pip install .
    startCommand: uvicorn cmx.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: CMX_CORS_ORIGINS
        sync: false
      - key: CMX_BRAVE_SEARCH_API_KEY
        sync: false
      - key: CMX_AUTH_DB_PATH
        value: /opt/render/project/src/data/cmx-auth.sqlite3
      - key: CMX_ASSESSMENT_DB_PATH
        value: /opt/render/project/src/data/cmx-assessments.sqlite3
    disk:
      name: cmx-api-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmx-decision-engine"
version = "0.1.0"
description = "Evidence-aware, explainable decision support for Customer & Market Experience (CMX)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "jsonschema>=4.23,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[project.scripts]
cmx-api = "cmx.main:run"
cmx-auth = "cmx.auth_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
